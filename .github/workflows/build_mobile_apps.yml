name: Build DG Cloud Mobile Apps (APK & IPA)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which mobile build to run (note: macOS uses 10x free tier minutes)'
        required: true
        default: 'android'
        type: choice
        options:
          - 'android'
          - 'all'
          - 'ios'
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - '.github/workflows/build_mobile_apps.yml'

jobs:
  build-android:
    name: Build Android Release APK
    if: github.event_name == 'push' || github.event.inputs.platform != 'ios'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Assemble Android Project & Compile Release APK
        run: |
          # 1. Generate clean official Flutter Android scaffold
          flutter create --org com.dgcloud --project-name dgcloud_client --platforms=android build_app
          
          # 2. Inject our production Dart code and brand assets
          cp -r client/lib/* build_app/lib/
          mkdir -p build_app/assets
          cp -r client/assets/* build_app/assets/
          
          # 3. Copy our pubspec.yaml with verified dependencies & Android launcher icon config
          cp client/pubspec.yaml build_app/pubspec.yaml
          cp client/flutter_launcher_icons_android.yaml build_app/flutter_launcher_icons_android.yaml
          
          # 4. Inject Android Manifest with all background permissions & cleartext HTTP support
          cp client/android/app/src/main/AndroidManifest.xml build_app/android/app/src/main/AndroidManifest.xml
          
          # 5. Set minSdk 21 via local.properties (official Flutter standard)
          cd build_app
          echo "flutter.minSdkVersion=21" >> android/local.properties
          
          # 6. Fetch dependencies, generate Android launcher icons, and compile release APK
          flutter pub get
          dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: DGCloud-Android-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA Package
    if: github.event_name == 'push' || github.event.inputs.platform != 'android'
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Assemble iOS Project & Compile IPA
        run: |
          # 1. Generate clean official Flutter iOS scaffold
          flutter create --org com.dgcloud --project-name dgcloud_client --platforms=ios build_app
          
          # 2. Inject our production Dart code and brand assets
          cp -r client/lib/* build_app/lib/
          mkdir -p build_app/assets
          cp -r client/assets/* build_app/assets/
          
          # 3. Copy our pubspec.yaml with verified dependencies & iOS launcher icon config
          cp client/pubspec.yaml build_app/pubspec.yaml
          cp client/flutter_launcher_icons_ios.yaml build_app/flutter_launcher_icons_ios.yaml
          
          # 4. Inject iOS permissions, ATS HTTP support & background fetch in Info.plist
          cp client/ios/Runner/Info.plist build_app/ios/Runner/Info.plist
          
          cd build_app
          flutter pub get
          dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml
          
          # 5. Build iOS app in release mode without code signing requirement
          flutter build ios --release --no-codesign
          
          # 6. Package Runner.app into standard sideloadable DGCloud_iOS.ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r DGCloud_iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v6
        with:
          name: DGCloud-iOS-IPA
          path: build_app/build/ios/iphoneos/DGCloud_iOS.ipa
          if-no-files-found: error
